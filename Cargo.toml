[workspace]
resolver = "2"
members = [
    "crates/wp-bidi",
    "crates/wp-break",
    "crates/wp-normal",
    "crates/wp-odt",
    "crates/wp-ole",
    "crates/wp-pdf",
    "crates/wp-segment",
    "crates/wp-cipher",
    "crates/wp-cli",
    "crates/wp-crypt",
    "crates/wp-deflate",
    "crates/wp-dict",
    "crates/wp-doc",
    "crates/wp-docx",
    "crates/wp-font",
    "crates/wp-grammar",
    "crates/wp-hash",
    "crates/wp-html",
    "crates/wp-image",
    "crates/wp-rtf",
    "crates/wp-shape",
    "crates/wp-text",
    "crates/wp-svg",
    "crates/wp-raster",
    "crates/wp-rsa",
    "crates/wp-shell",
    "crates/wp-sign",
    "crates/wp-app",
    "crates/wp-asn1",
    "crates/wp-layout",
    "crates/wp-opc",
    "crates/wp-xml",
    "crates/wp-zip",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Raised from 1.75 when the font reader started using Option::is_none_or.
# The declared minimum has to match what the code actually needs, or it is
# a claim nobody has checked.
rust-version = "1.82"
license = "MIT"
repository = ""

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
# Font parsing and rasterization are unbearably slow in a fully unoptimized
# build, so debug builds keep a light optimization level.
opt-level = 1
