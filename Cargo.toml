[workspace]
resolver = "2"
members = [
    "crates/wp-deflate",
    "crates/wp-xml",
    "crates/wp-zip",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = ""

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
# Font parsing and rasterization are unbearably slow in a fully unoptimized
# build, so debug builds keep a light optimization level.
opt-level = 1
