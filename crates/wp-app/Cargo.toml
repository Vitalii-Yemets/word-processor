[package]
name = "wp-app"
description = "The windowed application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "word-processor"
path = "src/main.rs"

[dependencies]
wp-crypt = { path = "../wp-crypt" }
wp-dict = { path = "../wp-dict" }
wp-docx = { path = "../wp-docx" }
wp-ole = { path = "../wp-ole" }
wp-vba = { path = "../wp-vba" }
wp-segment = { path = "../wp-segment" }
wp-layout = { path = "../wp-layout" }
wp-pdf = { path = "../wp-pdf" }
wp-raster = { path = "../wp-raster" }
wp-image = { path = "../wp-image" }
wp-svg = { path = "../wp-svg" }
wp-shell = { path = "../wp-shell" }
wp-doc = { path = "../wp-doc" }
wp-html = { path = "../wp-html" }
wp-odt = { path = "../wp-odt" }
wp-rtf = { path = "../wp-rtf" }
wp-text = { path = "../wp-text" }
# Signing a document from the program, and saying what a signature on one is
# worth: the certificate store is the shell's, the chain is wp-sign's.
wp-asn1 = { path = "../wp-asn1" }
wp-rsa = { path = "../wp-rsa" }
wp-sign = { path = "../wp-sign" }

[lints]
workspace = true

[dev-dependencies]
# The tests build a document carrying a Visual Basic project, which
# means reaching the package under it.
wp-opc = { path = "../wp-opc" }
# And an encrypted PDF, enciphered by hand.
wp-cipher = { path = "../wp-cipher" }
wp-hash = { path = "../wp-hash" }
