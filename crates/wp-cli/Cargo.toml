[package]
name = "wp-cli"
description = "Command line front end, used to exercise the document stack while there is no window yet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wp"
path = "src/main.rs"

[dependencies]
wp-doc = { path = "../wp-doc" }
wp-html = { path = "../wp-html" }
wp-odt = { path = "../wp-odt" }
wp-rtf = { path = "../wp-rtf" }
wp-docx = { path = "../wp-docx" }
wp-image = { path = "../wp-image" }
wp-layout = { path = "../wp-layout" }
wp-pdf = { path = "../wp-pdf" }
wp-opc = { path = "../wp-opc" }
wp-raster = { path = "../wp-raster" }
wp-asn1 = { path = "../wp-asn1" }
wp-rsa = { path = "../wp-rsa" }
wp-sign = { path = "../wp-sign" }

[lints]
workspace = true
