[package]
name = "wp-doc"
description = "The binary Word document: the compound file, the piece table and the formatting sprms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wp-ole = { path = "../wp-ole" }
# Workspace-internal only. The document model to read into, the code pages
# the old text is in, the pictures' formats, the deflate a metafile in a
# drawing is squeezed with, and the ciphers an encrypted document is
# enciphered with.
wp-crypt = { path = "../wp-crypt" }
wp-deflate = { path = "../wp-deflate" }
wp-docx = { path = "../wp-docx" }
wp-image = { path = "../wp-image" }
wp-text = { path = "../wp-text" }

[dev-dependencies]
# Used only by the tests: to draw a picture to put into a document, and to
# encipher documents by the specification, apart from the code being tested.
wp-cipher = { path = "../wp-cipher" }
wp-hash = { path = "../wp-hash" }
wp-raster = { path = "../wp-raster" }

[lints]
workspace = true
