[package]
name = "wp-doc"
description = "The binary Word document: the compound file, the piece table and the formatting sprms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wp-ole = { path = "../wp-ole" }
# Workspace-internal only. The document model to read into, the code pages
