[package]
name = "wp-docx"
description = "WordprocessingML document model: reading and writing the body of a .docx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wp-dict = { path = "../wp-dict" }
wp-grammar = { path = "../wp-grammar" }
wp-crypt = { path = "../wp-crypt" }
wp-sign = { path = "../wp-sign" }
wp-hash = { path = "../wp-hash" }
wp-opc = { path = "../wp-opc" }
wp-ole = { path = "../wp-ole" }
wp-normal = { path = "../wp-normal" }
wp-segment = { path = "../wp-segment" }
wp-text = { path = "../wp-text" }
wp-xml = { path = "../wp-xml" }

[lints]
workspace = true

[dev-dependencies]
# Used only by the tests, to build an archive that is not a valid package.
wp-zip = { path = "../wp-zip" }
wp-image = { path = "../wp-image" }
# And to hash a password the way an older Word did, so that reading one back
# is tested against arithmetic done outside the code under test.
wp-hash = { path = "../wp-hash" }
wp-text = { path = "../wp-text" }
# And to seal a document that the tests then hand to another program.
wp-crypt = { path = "../wp-crypt" }
