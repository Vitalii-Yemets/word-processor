[package]
name = "wp-shell"
description = "The platform shell: a window, an event loop, and getting pixels onto the screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wp-deflate = { path = "../wp-deflate" }
wp-raster = { path = "../wp-raster" }

# The code pages text from an X input method may come in: compound text
# switches between the East Asian national sets, and those are code pages.
# And the pictures the desktop's portal hands back, which are PNG files: on
# Wayland a screenshot is one of those rather than pixels read off a server.
[target.'cfg(target_os = "linux")'.dependencies]
wp-text = { path = "../wp-text" }
wp-image = { path = "../wp-image" }

# The workspace forbids unsafe everywhere else. Talking to an operating system
# means calling C functions, which cannot be done any other way, so this one
# crate allows it and keeps the surface as small as possible.
[lints.rust]
missing_debug_implementations = "warn"
